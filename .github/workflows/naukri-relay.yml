name: public-naukri-relay

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-naukri-relay
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout relay repository
        uses: actions/checkout@v4

      - name: Checkout private app config only
        uses: actions/checkout@v4
        with:
          repository: AvinashBhalla/job-beeper
          ref: v2-live-radar
          path: private-app
          token: ${{ secrets.PRIVATE_APP_READ_TOKEN }}
          sparse-checkout: |
            v2/config.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector
        run: |
          python -m pip install --upgrade pip
          pip install python-jobspy==1.2.0

      - name: Collect Naukri jobs
        run: |
          python - <<'PY'
          import concurrent.futures
          import datetime as dt
          import json
          import time
          import threading
          from pathlib import Path
          from jobspy import scrape_jobs
          from jobspy.naukri import Naukri
          from jobspy.naukri.constant import job_page_headers
          from jobspy.naukri.util import generate_nkparam
          from jobspy.model import DescriptionFormat
          from jobspy.util import markdown_converter, plain_converter

          # JobSpy 1.2.0 already fetches /jobapi/v4/job/{id} for the description.
          # Capture that same response once so the relay can preserve Naukri's
          # structured role, education and key-skills fields without a second request.
          captured_details = {}
          captured_details_lock = threading.Lock()

          def fetch_details_with_capture(self, job_id):
              try:
                  response = self.session.get(
                      f"{self.job_page_url}/{job_id}",
                      headers=job_page_headers | {"nkparam": generate_nkparam(job_id)},
                  )
                  response.raise_for_status()
                  detail = response.json()["jobDetails"]
              except Exception as exc:
                  print(
                      f"Structured Naukri details unavailable for {job_id}: {type(exc).__name__}",
                      flush=True,
                  )
                  return {}

              with captured_details_lock:
                  captured_details[str(job_id)] = detail

              description = detail.get("description")
              if self.scraper_input.description_format == DescriptionFormat.MARKDOWN:
                  description = markdown_converter(description)
              elif self.scraper_input.description_format == DescriptionFormat.PLAIN:
                  description = plain_converter(description)

              company = detail.get("companyDetail") or {}
              return {
                  "description": description or None,
                  "job_type": self._parse_job_type(detail.get("jobType")),
                  "vacancy_count": detail.get("vacancy"),
                  "job_url_direct": detail.get("applyRedirectUrl") or None,
                  "company_industry": detail.get("industry") or None,
                  "job_function": detail.get("functionalArea") or None,
                  "company_description": plain_converter(company.get("details")) or None,
                  "company_addresses": company.get("address") or None,
              }

          Naukri._fetch_details = fetch_details_with_capture

          scan_started = time.monotonic()
          config = json.loads(Path("private-app/v2/config.json").read_text(encoding="utf-8"))
          queries = config.get("naukri_queries", [])
          locations = config.get("naukri_locations", ["India"])
          if not queries:
              raise SystemExit("No naukri_queries configured")

          # Run a small, bounded number of independent searches concurrently.
          # This shortens the relay's serial query bottleneck without flooding Naukri.
          targets = [(query, location) for location in locations for query in queries]
          def collect_target(target):
              query, location = target
              started = time.monotonic()
              print(f"Collecting query={query!r}, location={location!r}", flush=True)
              frame = scrape_jobs(
                  site_name=["naukri"], search_term=query, location=location,
                  results_wanted=25, hours_old=72, fetch_description=True,
                  description_format="markdown", verbose=0,
              )
              rows = [] if frame is None or frame.empty else frame.to_dict("records")
              print(
                  f"Finished query={query!r}, location={location!r}, "
                  f"rows={len(rows)}, elapsed={time.monotonic()-started:.1f}s",
                  flush=True,
              )
              return location, rows

          collected, failed_targets = [], []
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              futures = {pool.submit(collect_target, target): target for target in targets}
              for future in concurrent.futures.as_completed(futures):
                  target = futures[future]
                  try:
                      collected.append(future.result())
                  except Exception as exc:
                      failed_targets.append((target, repr(exc)))
                      print(f"Search failed target={target!r}: {exc!r}", flush=True)

          jobs, seen = [], set()
          for location, rows in collected:
              for row in rows:
                  url = str(row.get("job_url") or row.get("job_url_direct") or "").strip()
                  if not url or url in seen:
                      continue
                  seen.add(url)
                  posted = row.get("date_posted")
                  if hasattr(posted, "isoformat"):
                      posted = posted.isoformat()
                  description = str(row.get("description") or "")
                  exp = row.get("experience_range")
                  search_skills = row.get("skills")
                  if exp:
                      description += "\n\n" + str(exp)
                  if search_skills:
                      # Keep the search API's skills in searchable text as before.
                      description += "\n\n" + str(search_skills)

                  raw_id = str(row.get("id") or "")
                  detail_id = raw_id.removeprefix("nk-")
                  detail = captured_details.get(detail_id, {})
                  raw_skills = (detail.get("keySkills") or {}) if isinstance(detail, dict) else {}
                  all_skills = []
                  if isinstance(raw_skills, dict):
                      seen_skill_labels = set()
                      for group_values in raw_skills.values():
                          if not isinstance(group_values, list):
                              continue
                          for skill in group_values:
                              label = skill.get("label") if isinstance(skill, dict) else skill
                              label = str(label or "").strip()
                              if label and label.casefold() not in seen_skill_labels:
                                  all_skills.append(label)
                                  seen_skill_labels.add(label.casefold())
                  if not all_skills and search_skills:
                      all_skills = [part.strip() for part in str(search_skills).split(",") if part.strip()]

                  education = detail.get("education") or {}
                  if not isinstance(education, dict):
                      education = {}
                  source_details = {
                      "role": detail.get("jobRole"),
                      "role_category": detail.get("roleCategory"),
                      "industry_type": detail.get("industry") or row.get("company_industry"),
                      "department": detail.get("functionalArea") or row.get("job_function"),
                      "employment_type": detail.get("employmentType"),
                      "education": {
                          "ug": education.get("ug") or [],
                          "pg": education.get("pg") or [],
                          "ppg": education.get("ppg") or [],
                      },
                      "key_skills": all_skills,
                  }
                  jobs.append({
                      "id": "nk-" + str(row.get("id") or url),
                      "source": "naukri",
                      "company": str(row.get("company") or row.get("company_name") or ""),
                      "title": str(row.get("title") or ""),
                      "location": str(row.get("location") or location),
                      "url": url,
                      "posted": posted,
                      "description": description.strip(),
                      "description_format": "markdown",
                      "source_details": source_details,
                  })

          print(
              f"Naukri scan summary: targets={len(targets)} completed={len(collected)} "
              f"failed={len(failed_targets)} unique_jobs={len(jobs)} "
              f"elapsed={time.monotonic()-scan_started:.1f}s",
              flush=True,
          )
          if failed_targets and not collected:
              raise SystemExit("All Naukri searches failed; preserving the last-good feed")

          def sort_key(job):
              value = job.get("posted")
              if not value:
                  return dt.datetime.min.replace(tzinfo=dt.timezone.utc)
              try:
                  parsed = dt.datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  return parsed if parsed.tzinfo else parsed.replace(tzinfo=dt.timezone.utc)
              except ValueError:
                  return dt.datetime.min.replace(tzinfo=dt.timezone.utc)

          jobs.sort(key=sort_key, reverse=True)
          if not jobs:
              raise SystemExit("No Naukri jobs collected; preserving the last-good feed")
          payload = {
              "updated_at": dt.datetime.now(dt.timezone.utc).isoformat(),
              "count": len(jobs),
              "jobs": jobs[:500],
          }
          Path("naukri_relay.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          print(f"Collected {len(jobs)} unique Naukri jobs")
          PY

      - name: Publish only the generated feed
        run: |
          test -s naukri_relay.json
          git config user.name "job-watch-bot"
          git config user.email "bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin naukri-relay >/dev/null 2>&1; then
            git fetch origin naukri-relay
            git checkout -B naukri-relay origin/naukri-relay
          else
            git checkout --orphan naukri-relay
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p dashboard/data
          cp naukri_relay.json dashboard/data/naukri_relay.json
          git add dashboard/data/naukri_relay.json
          if git diff --cached --quiet; then
            echo "Feed unchanged; no commit needed."
            exit 0
          fi
          git commit -m "relay latest Naukri feed"
          git push origin HEAD:naukri-relay
